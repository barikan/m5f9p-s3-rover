# 開発環境とよく使う処理。
#
#   mise install        ツール(PlatformIO, uv)を入れる
#   mise run setup      ESP32のツールチェーンとライブラリを入れる
#   mise tasks          タスクの一覧
#
# シリアルポートは自動で探す。指定する時は環境変数 PORT を使う。
#   PORT=/dev/ttyACM1 mise run upload

[tools]
"pipx:platformio" = "6.1.19"
uv = "0.12.13"
# Androidアプリ(android/)用
java = "temurin-21"
android-sdk = "19.0"
# Windowsアプリ(windows/)用
node = "22"

[tasks.setup]
description = "ESP32のツールチェーンとライブラリをインストールする(初回のみ)"
run = "pio pkg install"

[tasks.build]
description = "ビルドする"
run = "pio run"

[tasks.check]
description = "追加の警告を有効にしてビルドする"
env = { PLATFORMIO_BUILD_FLAGS = "-Wall -Wextra -Wno-unused-parameter" }
run = "pio run"

[tasks.clean]
description = "ビルド結果を消す"
run = "pio run -t clean"

[tasks.port]
description = "ESP32-S3のシリアルポートを表示する"
run = "scripts/find-port.sh"

[tasks.usb-attach]
description = "WSL2用: USBデバイスをWSLに接続する(抜き差しのたびに実行)"
run = "scripts/usb-attach.sh"

[tasks.upload]
description = "ビルドして実機に書き込む(失敗時は3回まで再試行)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
port=$(scripts/find-port.sh)
for i in 1 2 3; do
	if pio run -t upload --upload-port "$port"; then
		exit 0
	fi
	echo "書き込みに失敗しました ($i/3)" >&2
	# usbipd経由(WSL2)だと書き込みが失敗し、そのまま再試行しても失敗し続ける事がある。
	# スタブを使わずに接続してリセットすると復旧する。
	pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32s3 --port "$port" --no-stub chip_id >/dev/null 2>&1 || true
	sleep 2
done
exit 1
'''

[tasks.monitor]
description = "シリアルモニタを開く(対話式。Ctrl+Cで終了)"
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
pio device monitor --port "$(scripts/find-port.sh)"
'''

[tasks.log]
description = "シリアルログを指定秒数だけ読み出す"
usage = '''
arg "[seconds]" help="読み出す秒数" default="30"
flag "-r --reset" help="読み出しの前にチップをリセットする"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
port=$(scripts/find-port.sh)
opts=()
if [ "${usage_reset:-false}" = "true" ]; then opts+=(--reset); fi
uv run --quiet scripts/serial_log.py "$port" "${usage_seconds?}" "${opts[@]}"
'''

[tasks.lcd-shot]
description = "本体の画面の内容をPNGに保存する(確認用)"
usage = 'arg "[file]" default="lcd.png" help="保存先"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
port=$(scripts/find-port.sh)
uv run --quiet scripts/lcd_shot.py "$port" "${usage_file?}"
'''

[tasks.lcd-tap]
description = "本体の画面をタップした事にする(確認用)。例: mise run lcd-tap 160 120"
usage = '''
arg "<x>" help="0-319"
arg "<y>" help="0-239"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
port=$(scripts/find-port.sh)
uv run --quiet scripts/devcmd.py "$port" "{\"cmd\":\"lcd.tap\",\"x\":${usage_x?},\"y\":${usage_y?}}" > /dev/null
'''

[tasks.lcd-assets]
description = "本体の画面のフォントとアイコン(src/lcd_assets.h)を作り直す"
run = "uv run --quiet --with resvg-py --with pillow python3 scripts/make_lcd_assets.py"

[tasks.cmd]
description = "本体にコマンド(JSON)を送る。例: mise run cmd '{\"cmd\":\"status\"}'"
usage = 'arg "<json>" help="コマンド。一覧は src/cmd.cpp の先頭にある"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
port=$(scripts/find-port.sh)
uv run --quiet scripts/devcmd.py "$port" "${usage_json?}"
'''

[tasks.config-get]
description = "本体のSDカードから設定ファイル(YAML)を取り出す"
usage = 'arg "[file]" help="保存先。省略時は標準出力"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
port=$(scripts/find-port.sh)
uv run --quiet scripts/devcmd.py "$port" config-get ${usage_file:+"$usage_file"}
'''

[tasks.config-put]
description = "本体のSDカードに設定ファイル(YAML)を書き込む(反映には再起動が必要)"
usage = 'arg "<file>" help="書き込むYAMLファイル"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
port=$(scripts/find-port.sh)
uv run --quiet scripts/devcmd.py "$port" config-put "${usage_file?}"
'''

# ---------------------------------------------------------------- Androidアプリ (android/)

[tasks.android-setup]
description = "Android SDKのパッケージをインストールする(初回のみ。ライセンスに同意する)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
yes | sdkmanager --licenses >/dev/null || true
sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
'''

[tasks.web-setup]
description = "共通の画面(web/)のビルドに使うパッケージをインストールする(初回のみ)"
dir = "web"
run = "npm install --no-audit --no-fund"

[tasks.web-check]
description = "共通の画面(web/)の型を検査する"
dir = "web"
run = "npm run check --silent"

[tasks.web-build]
description = "共通の画面(web/)の型を検査してビルドする(出力は web/dist)"
dir = "web"
run = "npm run build --silent"

[tasks.web-dev]
description = "共通の画面をブラウザで確認する(本体には接続できない。見た目の確認用)"
dir = "web"
run = "npm run dev"

[tasks.android-build]
description = "Androidアプリをビルドする(デバッグ用APK)"
depends = ["web-build"]
dir = "android"
run = "./gradlew --no-daemon -q assembleDebug"

[tasks.android-attach]
description = "WSL2用: Android端末をWSLに接続する(抜き差しのたびに実行)"
usage = 'arg "[vid]" help="USBのベンダーID。Pixelは18d1" default="18d1"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
scripts/usb-attach.sh "${usage_vid?}"
sleep 2
"$ANDROID_HOME/platform-tools/adb" devices
'''

[tasks.android-pair]
description = "Android端末とWi-Fi経由でペア設定する(ワイヤレスデバッグ。初回のみ)"
usage = '''
arg "<address>" help="「ペア設定コードによるデバイスのペア設定」に表示されるIPアドレスとポート"
arg "<code>" help="同じ画面に表示される6桁のコード"
'''
run = '"$ANDROID_HOME/platform-tools/adb" pair "${usage_address?}" "${usage_code?}"'

[tasks.android-connect]
description = "Android端末にWi-Fi経由で接続する(ワイヤレスデバッグ)"
usage = 'arg "<address>" help="「ワイヤレス デバッグ」の画面に表示されるIPアドレスとポート"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
adb="$ANDROID_HOME/platform-tools/adb"
"$adb" connect "${usage_address?}"
"$adb" devices
'''

[tasks.android-install]
description = "Androidアプリをビルドして端末にインストールし、起動する"
depends = ["android-build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
adb="$ANDROID_HOME/platform-tools/adb"
"$adb" install -r android/app/build/outputs/apk/debug/app-debug.apk
"$adb" shell am start -n jp.azukimap.m5f9p/.MainActivity
'''

[tasks.android-log]
description = "Androidアプリのログを指定秒数だけ読み出す"
usage = 'arg "[seconds]" help="読み出す秒数" default="10"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
adb="$ANDROID_HOME/platform-tools/adb"
pid=$("$adb" shell pidof jp.azukimap.m5f9p || true)
if [ -z "$pid" ]; then echo "アプリが起動していません" >&2; exit 1; fi
timeout "${usage_seconds?}" "$adb" logcat --pid="$pid" -v brief || true
'''

[tasks.android-screenshot]
description = "Android端末の画面を画像ファイルに保存する"
usage = 'arg "[file]" help="保存先" default="screenshot.png"'
run = '"$ANDROID_HOME/platform-tools/adb" exec-out screencap -p > "${usage_file?}"'

# ---------------------------------------------------------------- Windowsアプリ (windows/)

[tasks.win-setup]
description = "Windowsアプリ用のElectron(Windows版)をインストールする(初回のみ)"
dir = "windows"
env = { npm_config_platform = "win32", npm_config_arch = "x64" }
run = "npm install --no-audit --no-fund"

[tasks.win-run]
description = "WindowsアプリをWSLから開発用に起動する(終了は mise run win-stop)"
depends = ["web-build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
# 画面の確認用の仕掛け(scripts/win-dev.py)を有効にして起動する。
# WSL上のファイルから起動するとChromiumのサンドボックスが動かないので、開発時は無効にする。
dev=$(python3 scripts/win-dev.py dir)
rm -f "$dev"/res-* "$dev"/req*
cd windows
M5F9P_DEV_DIR="$dev" WSLENV=M5F9P_DEV_DIR/p nohup ./node_modules/electron/dist/electron.exe --no-sandbox . > "$dev/electron.log" 2>&1 &
echo "起動しました。ログ: $dev/electron.log"
'''

[tasks.win-stop]
description = "開発用に起動したWindowsアプリを終了する"
run = "python3 scripts/win-dev.py quit"

[tasks.win-shot]
description = "開発用に起動したWindowsアプリのウィンドウを画像に保存する"
usage = 'arg "[file]" help="保存先" default="screenshot.png"'
run = 'python3 scripts/win-dev.py shot "${usage_file?}"'

[tasks.win-eval]
description = "開発用に起動したWindowsアプリの画面内でJavaScriptを実行する"
usage = 'arg "<code>" help="実行するJavaScriptの式"'
run = 'python3 scripts/win-dev.py eval "${usage_code?}"'

