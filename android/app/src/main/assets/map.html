<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script>
// アプリ(MapScreen.kt)から呼び出される関数と、アプリへの通知(Android.xxx)を定義する。
// APIキーは、読み込み時にアプリが %KEY% を置き換えて渡す。

const COLORS = { 4: '#2E7D32', 5: '#EF6C00', 0: '#C62828' };   // Fix, Float, 測位不能
const colorOf = q => COLORS[q] || '#546E7A';

let map = null;
let marker = null;
let lines = [];         // 測位の状態が変わる毎に線を分ける（色を変えるため）
let lastLine = null;
let lastQuality = -1;
let follow = true;

function init() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: %LAT%, lng: %LON% },
    zoom: %ZOOM%,
    mapTypeId: 'roadmap',
    disableDefaultUI: true,
    gestureHandling: 'greedy',
    tilt: 0,
  });
  // 地図を指で動かしたら追従をやめる
  map.addListener('dragstart', () => {
    if (follow) {
      follow = false;
      Android.onFollow(false);
    }
  });
  marker = new google.maps.Marker({ map: map, visible: false, clickable: false, zIndex: 10 });
  console.log('map init: window=' + window.innerWidth + 'x' + window.innerHeight +
              ' map=' + document.getElementById('map').offsetWidth + 'x' + document.getElementById('map').offsetHeight);
  Android.onReady();
}

// APIキーが無効な時にMaps JavaScript APIから呼ばれる
window.gm_authFailure = () => Android.onAuthFailure();

function clearTrack() {
  for (const line of lines) line.setMap(null);
  lines = [];
  lastLine = null;
  lastQuality = -1;
}

function addPoint(lat, lng, quality) {
  const position = new google.maps.LatLng(lat, lng);
  if (!lastLine || quality !== lastQuality) {
    // 線がつながるよう、前の線の最後の点から始める
    const path = lastLine ? lastLine.getPath() : null;
    const previous = path && path.getLength() ? path.getAt(path.getLength() - 1) : null;
    lastLine = new google.maps.Polyline({
      map: map, strokeColor: colorOf(quality), strokeWeight: 4, strokeOpacity: 1, clickable: false,
    });
    if (previous) lastLine.getPath().push(previous);
    lines.push(lastLine);
    lastQuality = quality;
  }
  lastLine.getPath().push(position);
}

// points: [[lat, lng, quality], ...]
function setTrack(points) {
  clearTrack();
  for (const p of points) addPoint(p[0], p[1], p[2]);
}

function setCurrent(lat, lng, quality) {
  const position = { lat: lat, lng: lng };
  marker.setIcon({
    path: google.maps.SymbolPath.CIRCLE, scale: 8,
    fillColor: colorOf(quality), fillOpacity: 1, strokeColor: '#FFFFFF', strokeWeight: 2,
  });
  marker.setPosition(position);
  marker.setVisible(true);
  if (follow) map.panTo(position);
}

function hideCurrent() {
  marker.setVisible(false);
}

function setFollow(on) {
  follow = on;
  if (on && marker.getVisible()) map.panTo(marker.getPosition());
}

function moveTo(lat, lng, zoom) {
  map.setCenter({ lat: lat, lng: lng });
  if (zoom) map.setZoom(zoom);
}

function setMapType(type) {
  map.setMapTypeId(type);
}
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=%KEY%&callback=init&language=ja&region=JP"></script>
</body>
</html>
