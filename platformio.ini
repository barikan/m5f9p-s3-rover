[env:m5stack-cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
lib_deps =
    m5stack/M5Unified@^0.2.25
    bblanchon/ArduinoJson@^7.2.0
    tobozo/YAMLDuino@^1.5.0
monitor_speed = 115200
; YAMLDuinoのArduinoJson連携を有効にする。ライブラリ側でArduinoJsonが見つからないと
; 連携の関数がビルドされないので、依存関係を深く探させる。
lib_ldf_mode = deep
build_flags = -DHAS_ARDUINOJSON
